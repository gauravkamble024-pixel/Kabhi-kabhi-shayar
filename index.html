<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f3ec" />
  <title>Kabhi Kabhi Shayar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f7f3ec;--ink:#29251f;--muted:#898279;--border:#e3dccd;--card:#fffcf7}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--paper)}
    body{font-family:'Poppins',sans-serif;color:var(--ink);margin:0;padding:0;display:flex;justify-content:center}
    .wrap{width:min(720px,100%);margin:0 auto;padding:40px 20px 60px}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;border-bottom:1px solid var(--border);padding-bottom:16px}
    .brand{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;letter-spacing:0.5px}
    .edition{font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
    .intro{text-align:center;padding:20px 0 36px}
    .eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    h1{font-family:'Playfair Display',serif;font-size:36px;font-weight:400;margin:0 0 12px;line-height:1.2}
    .intro p{font-size:15px;color:var(--muted);margin:0;font-style:italic}
    .ornament{text-align:center;color:var(--border);margin:24px 0;font-size:18px}
    
    .poems{display:flex;flex-direction:column;gap:24px;margin-bottom:40px}
    .poem{background:var(--card);border:1px solid var(--border);padding:28px 24px;border-radius:4px;box-shadow:0 2px 8px rgba(41,37,31,0.02)}
    .poem p{font-family:'Playfair Display',serif;font-size:18px;line-height:1.6;margin:0 0 16px;white-space:pre-wrap}
    .poem span{font-size:13px;color:var(--muted);letter-spacing:0.5px}

    .formbox{background:var(--card);border:1px solid var(--border);padding:24px;border-radius:4px;margin-top:20px}
    .formbox label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .formbox textarea, .formbox input{width:100%;font-family:'Poppins',sans-serif;font-size:14px;padding:12px;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:2px;margin-bottom:16px;resize:vertical}
    .formbox textarea{height:100px}
    .formbox button{background:var(--ink);color:var(--paper);border:none;padding:12px 24px;font-size:13px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px;width:100%}
    .formbox button:hover{opacity:0.9}

    .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:40px;border-top:1px solid var(--border);padding-top:20px;letter-spacing:1px}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand">Kabhi Kabhi Shayar</div>
      <div class="edition">Mehfil</div>
    </header>

    <div class="intro">
      <p class="eyebrow">Alfaaz · Ehsaas · Sukoon</p>
      <h1>Kabhi kabhi,<br>kuch kehna hota hai.</h1>
      <p>Bas shayari. Aur uske peeche ka naam.</p>
      <div class="ornament">— ❊ —</div>
    </div>

    <!-- Container where shayaris will load -->
    <div id="poems" class="poems"></div>

    <!-- Submission Form Box -->
    <form class="formbox" id="poemForm">
      <label for="verse">Shayari</label>
      <textarea id="verse" required placeholder="Apne dil ki baat yahan likhiye..."></textarea>
      
      <label for="poet">Aapka Naam (Poet)</label>
      <input type="text" id="poet" required placeholder="Aapka naam ya pen name..." />
      
      <button type="submit">Post Shayari</button>
    </form>

    <footer class="foot">KABHI KABHI SHAYAR</footer>
  </main>

  <script>
    // YOUR JSONBIN CREDENTIALS
    const BIN_ID = "6ad660b2ffd5d1605379ad5a";
    const API_KEY = "$2a$10$pqTJrkG0arYW6PBu33yBG0F5d05R2q.5H024X2zF3vj9Y1Lg7j89K"; 
    
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // 1. Fetch and display shayaris when the page loads
    async function loadShayaris() {
      try {
        const response = await fetch(API_URL, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await response.json();
        const shayaris = data.record.shayaris || [];
        
        const poemsContainer = document.getElementById('poems');
        poemsContainer.innerHTML = '';
        
        shayaris.reverse().forEach(item => {
          const div = document.createElement('div');
          div.className = 'poem';
          div.innerHTML = `<p>${item.verse}</p><span>— ${item.poet}</span>`;
          poemsContainer.appendChild(div);
        });
      } catch (error) {
        console.error("Error loading shayaris:", error);
      }
    }

    // 2. Handle form submission to save new shayari permanently
    document.getElementById('poemForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const verse = document.getElementById('verse').value;
      const poet = document.getElementById('poet').value;

      try {
        const getRes = await fetch(API_URL, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const getData = await getRes.json();
        const currentList = getData.record.shayaris || [];

        currentList.push({ verse, poet });

        const updateRes = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify({ shayaris: currentList })
        });

        if (updateRes.ok) {
          document.getElementById('poemForm').reset();
          loadShayaris();
          alert('Shayari posted successfully for everyone to see!');
        } else {
          alert('Failed to post. Check your API key.');
        }
      } catch (error) {
        console.error("Error saving shayari:", error);
      }
    });

    loadShayaris();
  </script>
</body>
</html>
